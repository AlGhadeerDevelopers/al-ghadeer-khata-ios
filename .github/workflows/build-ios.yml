name: Build Al Ghadeer Khata Pro iOS (.IPA & iPhone Web App)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile iOS App (.ipa) on macOS Cloud Runner
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor iOS & Prepare Workspace
        run: |
          if [ ! -f "package.json" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "package.json" | head -n 1 | xargs dirname)
            if [ -n "$SUBDIR" ]; then
              cp -r "$SUBDIR"/* .
            fi
          fi
          mkdir -p www
          if [ ! -f "www/index.html" ] && [ -f "index.html" ]; then
            cp index.html www/index.html
          fi
          npm install
          npx cap add ios || true
          npx cap sync ios

      - name: Inject Info.plist Permissions, Icons & Disable Pod Signing
        run: |
          if [ -f "ios-template/Info.plist" ]; then
            cp -f ios-template/Info.plist ios/App/App/Info.plist
          fi
          if [ -d "ios-template/AppIcon.appiconset" ]; then
            rm -rf ios/App/App/Assets.xcassets/AppIcon.appiconset
            cp -r ios-template/AppIcon.appiconset ios/App/App/Assets.xcassets/
          fi
          cd ios/App
          if [ -f "Podfile" ]; then
            cat << 'RUBY' >> Podfile

            # Disable code signing requirements on CocoaPods targets for cloud unsigned IPA build
            post_install do |installer|
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
                end
              end
            end
            RUBY
            sed -i '' '/post_install do |installer|/,/end/{ /assertDeploymentTarget/d; }' Podfile || true
            pod install
          fi

      - name: Compile Unsigned iOS App & Package .IPA
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            XCODE_TARGET="-workspace App.xcworkspace"
          else
            XCODE_TARGET="-project App.xcodeproj"
          fi
          xcodebuild build \
            $XCODE_TARGET \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry Al-Ghadeer-Khata-Pro-iOS.ipa Payload

      - name: Upload Installable iOS .IPA Package
        uses: actions/upload-artifact@v4
        with:
          name: Al-Ghadeer-Khata-Pro-iOS-IPA
          path: ${{ runner.temp }}/ipa/Al-Ghadeer-Khata-Pro-iOS.ipa
          if-no-files-found: error
